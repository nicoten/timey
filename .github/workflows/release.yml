name: release

# Manual only, deliberately.
#
# Releases are currently built locally, because that machine holds the Developer
# ID certificate and the Apple credentials needed to sign and notarize. A runner
# has neither, so a tag-triggered build here would publish an ad-hoc-signed,
# un-notarized app over the good artifacts — and Gatekeeper would refuse it on
# any Mac that downloaded it.
#
# To make this the release path, add the Developer ID certificate as a base64
# .p12 (APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD) along with APPLE_ID,
# APPLE_PASSWORD, APPLE_TEAM_ID and APPLE_SIGNING_IDENTITY as repository
# secrets, pass them through to the tauri-action step, and restore the tag
# trigger below.
#
#   on:
#     push:
#       tags:
#         - "v*"
on:
  workflow_dispatch:

jobs:
  release:
    runs-on: macos-latest
    permissions:
      # Needed to create the release and upload assets.
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # The data layer is verified before anything is published.
      - run: pnpm test:rust
        env:
          SQLX_OFFLINE: true

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # src-tauri/.env points sqlx at a local dev.db that does not exist on a
          # runner. Without this, the committed .sqlx cache is ignored and the
          # build fails trying to reach a database.
          SQLX_OFFLINE: true
        with:
          tagName: ${{ github.ref_name }}
          releaseName: timey ${{ github.ref_name }}
          releaseBody: |
            Installed copies of timey update themselves from this release.
            To install for the first time, download the `.app.tar.gz` below.
          releaseDraft: false
          prerelease: false
          args: --target aarch64-apple-darwin
